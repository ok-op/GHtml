<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt-to-Image Converter</title>
  <style>
    /* General Styles */
    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f9;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header and Menu */
    header {
      background: #6200ea;
      color: white;
      padding: 1rem;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 10px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    /* Main Content */
    main {
      flex: 1;
      padding: 2rem;
      text-align: center;
    }

    textarea {
      width: 80%;
      height: 100px;
      padding: 10px;
      font-size: 16px;
      border: 2px solid #6200ea;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    select {
      width: 80%;
      padding: 10px;
      font-size: 16px;
      border: 2px solid #6200ea;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    button {
      background: #6200ea;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      margin: 5px;
    }

    button:hover {
      background: #3700b3;
    }

    #output {
      margin-top: 20px;
    }

    #output img {
      max-width: 100%;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    /* Modal for Image Preview */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      max-width: 90%;
      max-height: 90%;
    }

    .close {
      position: absolute;
      top: 20px;
      right: 30px;
      color: white;
      font-size: 30px;
      cursor: pointer;
    }

    /* Footer */
    footer {
      background: #333;
      color: white;
      text-align: center;
      padding: 1rem;
      width: 100%;
    }
  </style>
</head>
<body>
  <header>
    <h1>Prompt-to-Image Converter</h1>
    <nav>
      <a href="#">Home</a>
      <a href="https://t.me/Opleech_WD">About</a>
      <a href="https://t.me/Farooq_is_king">Contact</a>
    </nav>
  </header>

  <main>
    <textarea id="promptInput" placeholder="Enter your prompt here..."></textarea>
    <br>
    <label for="modelSelect">Select Model:</label>
    <select id="modelSelect">
      <option value="stabilityai/stable-diffusion-2">Stable Diffusion 2</option>
      <option value="runwayml/stable-diffusion-v1-5">Stable Diffusion v1.5</option>
      <option value="CompVis/stable-diffusion-v1-4">Stable Diffusion v1.4</option>
    </select>
    <br>
    <button onclick="generateImage()">Generate Image</button>
    <div id="output"></div>
    <button id="previewButton" style="display: none;" onclick="previewImage()">Preview Image</button>
    <button id="downloadButton" style="display: none;" onclick="downloadImage()">Download Image</button>
  </main>

  <!-- Modal for Image Preview -->
  <div id="previewModal" class="modal">
    <span class="close" onclick="closeModal()">&times;</span>
    <img class="modal-content" id="modalImage">
  </div>

  <footer>
    <p>&copy; 2025 𝐖𝐎𝐎𝐃𝐜𝐫𝐚𝐟𝐭. All rights reserved.</p>
  </footer>

    <script src="woodcraft/op-imege.js"></script>
</body>
  </html>
